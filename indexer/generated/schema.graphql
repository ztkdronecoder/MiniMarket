"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ViewPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type Meta {
  status: JSON
}

type Query {
  market(id: BigInt!): market
  markets(where: marketFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): marketPage!
  submission(id: String!): submission
  submissions(where: submissionFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): submissionPage!
  agent(id: String!): agent
  agents(where: agentFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): agentPage!
  agentMarket(id: String!): agentMarket
  agentMarkets(where: agentMarketFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): agentMarketPage!
  swap(id: String!): swap
  swaps(where: swapFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): swapPage!
  payout(id: String!): payout
  payouts(where: payoutFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): payoutPage!
  _meta: Meta
}

